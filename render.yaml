# Alternative to Fly — a Render blueprint. Same containers, same env vars;
# this file is the only thing that changes between hosts. `render.com` → New →
# Blueprint → point at this repo.
databases:
  - name: assistant-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: assistant-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: assistant-db, property: connectionString }
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: openai
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService: { name: assistant-frontend, type: web, property: host }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: TOKEN_ENCRYPTION_KEY, sync: false }
      - { key: GOOGLE_CLIENT_SECRET_JSON, sync: false }
      - { key: GOOGLE_REDIRECT_URI, sync: false }

  - type: web
    name: assistant-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService: { name: assistant-backend, type: web, property: host }
