# Fly.io config for the backend. Nothing here is app code — the container is a
# plain Dockerfile and the app is configured entirely through env vars, so any
# container host works (see docs/deploy.md).
app = "ai-assistant-backend-akshar"
primary_region = "sjc"

[build]

[env]
  APP_ENV = "production"
  LLM_PROVIDER = "openai"
  OPENAI_MODEL = "gpt-4.1-mini"
  EMBEDDING_MODEL = "text-embedding-3-small"

# Runs once per release, before the new version takes traffic.
[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
